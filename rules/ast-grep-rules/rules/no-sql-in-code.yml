id: no-sql-in-code
language: TypeScript
severity: warning
message: "Raw SQL in code — SQL lives in server/src/services (v3.2), values via bind params"
note: |
  Project override of the bundled `no-sql-in-code` rule (2026-09, v3.2):
  per the archived architecture decision ("서비스가 SQL 소유"), raw
  parameterized SQL is the sanctioned data-access idiom of this
  codebase — the service layer (server/src/services/*.service.ts) builds
  query text from fixed whitelisted fragments and passes every runtime
  value as a `$1…$n` bind parameter.

  The bundled rule stays meaningful for everything else (routes, scripts,
  one-off files): interpolated SQL outside the service layer is still a
  finding. Downgraded from `error` to `warning` only because the bundled
  severity cannot express "allowed inside server/src/services/**".
  (pi-lens rule schema has no path condition; kept `warning` so the
  convention violation remains visible without blocking the turn.)

  The `, $$$REST` suffix matches the optional parameters/options argument
  common to ORM `query()`/`execute()` signatures. The `has stopBy: end`
  on the string/regex probe is required because the SQL literal lives 2
  levels below the call_expression (inside `arguments`).

  `$SQL` is constrained to a `binary_expression` (string concatenation)
  or a template string with at least one `${...}` substitution — the two
  shapes that actually interpolate a runtime value into the query text.
  A plain string literal (even one containing a `?` placeholder passed
  alongside a params array) is NOT flagged. A `binary_expression` where
  BOTH sides are string literals is compile-time-constant text, not
  runtime interpolation — also not flagged.
rule:
  all:
    - any:
        - pattern: $DB.query($SQL)
        - pattern: $DB.query($SQL, $$$REST)
    - has:
        stopBy: end
        regex: >-
          (?i)(SELECT|INSERT|UPDATE|DELETE|CREATE TABLE|DROP TABLE|ALTER
          TABLE)
constraints:
  SQL:
    any:
      - all:
          - kind: binary_expression
          - not:
              all:
                - has:
                    field: left
                    kind: string
                - has:
                    field: right
                    kind: string
      - all:
          - kind: template_string
          - has:
              kind: template_substitution

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>페이지를 찾을 수 없어요 — 물품 대여</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-canvas: #f6f7f9;
        --color-ink-1: #111827;
        --color-ink-2: #4b5563;
        --color-ink-3: #9ca3af;
        --color-surface: #ffffff;
        --color-surface-muted: #f3f4f6;
        --color-line: #e5e7eb;
        --color-line-strong: #d1d5db;
        --color-primary: #ea580c;
        --color-primary-strong: #c2410c;
        --color-primary-deep: #9a3412;
        --color-primary-soft: #fff1e8;
        --color-warning: #b45309;
        --color-warning-soft: #fffbeb;
        --color-danger: #dc2626;
        --color-danger-soft: #fef2f2;

        --font-sans:
          "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

        --text-fine: 0.875rem;
        --text-fine--line-height: 1.5;
        --text-body: 1rem;
        --text-body--line-height: 1.5;
        --text-heading: 1.25rem;
        --text-heading--line-height: 1.4;
        --text-page-title: 1.5rem;
        --text-page-title--line-height: 1.35;

        --radius-card: 8px;
        --radius-pill: 999px;

        --shadow-menu: 0 8px 24px rgba(23, 23, 23, 0.1);
        --shadow-modal: 0 24px 64px rgba(23, 23, 23, 0.18);
      }
    </style>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-canvas);
        color: var(--color-ink-1);
      }
      ::selection {
        background: var(--color-primary-soft);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body class="flex min-h-dvh flex-col antialiased">
    <!-- 디자인 미리보기 전용 — 제품 UI 아님 -->
    
    <!-- 공개 헤더 -->
    <header class="border-b border-line bg-surface">
      <div class="mx-auto flex h-14 max-w-[1280px] items-center justify-between gap-4 px-4 sm:h-16 sm:px-6">
        <a href="index.html" class="flex min-w-0 items-center gap-2" aria-label="물품 현황 — 홈">
          <img src="assets/logo.png" alt="" class="h-7 w-7 rounded-card" />
        </a>
        <a
          href="login.html"
          class="inline-flex h-9 flex-none items-center rounded-card bg-primary-strong px-4 text-body font-semibold text-white transition-colors hover:bg-primary-deep focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          로그인
        </a>
      </div>
    </header>

    <main class="flex flex-1 flex-col items-center justify-center px-6 py-16 text-center">
      <span class="flex h-14 w-14 items-center justify-center rounded-pill bg-surface-muted text-ink-3" aria-hidden="true">
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7.5 4.27 9 5.15" />
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
          <path d="m3.3 7 8.7 5 8.7-5" />
          <path d="M12 22V12" />
        </svg>
      </span>

      <p class="mt-4 text-fine font-semibold text-primary-strong">404</p>
      <h1 class="mt-2 text-page-title font-bold tracking-[-0.015em] text-ink-1">페이지를 찾을 수 없어요</h1>
      <p class="mt-2 max-w-[320px] text-body leading-[1.5] text-ink-2">
        주소가 바뀌었거나 삭제된 페이지예요.<br />물품 현황으로 돌아가 볼까요?
      </p>

      <div class="mt-6 flex flex-wrap justify-center gap-2">
        <a
          href="index.html"
          class="inline-flex h-10 items-center rounded-card bg-primary-strong px-4 text-body font-semibold text-white transition-colors hover:bg-primary-deep focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          물품 현황으로
        </a>
        <button
          type="button"
          onclick="history.back()"
          class="inline-flex h-10 items-center rounded-card border border-line bg-surface px-4 text-body font-medium text-ink-1 transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          이전으로
        </button>
      </div>
    </main>

    <footer class="border-t border-line bg-surface">
      <div class="mx-auto flex max-w-[1000px] flex-col gap-2 px-4 py-8 text-fine text-ink-2 sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <p>정토회 · 함께 쓰는 물품</p>
        <nav class="flex gap-4" aria-label="정책">
          <a href="policy.html?kind=terms" class="transition-colors hover:text-ink-1 hover:underline">이용약관</a>
          <a href="policy.html?kind=privacy" class="transition-colors hover:text-ink-1 hover:underline">개인정보 처리방침</a>
        </nav>
      </div>
    </footer>
    <script src="preview.js"></script>
  </body>
</html>

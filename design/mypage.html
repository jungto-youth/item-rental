<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>내 정보 — 물품 대여</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-canvas: #f6f7f9;
        --color-ink-1: #111827;
        --color-ink-2: #4b5563;
        --color-ink-3: #9ca3af;
        --color-surface: #ffffff;
        --color-surface-muted: #f3f4f6;
        --color-line: #e5e7eb;
        --color-line-strong: #d1d5db;
        --color-primary: #ea580c;
        --color-primary-strong: #c2410c;
        --color-primary-deep: #9a3412;
        --color-primary-soft: #fff1e8;
        --color-warning: #b45309;
        --color-warning-soft: #fffbeb;
        --color-danger: #dc2626;
        --color-danger-soft: #fef2f2;

        --font-sans:
          "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

        --text-fine: 0.875rem;
        --text-fine--line-height: 1.5;
        --text-body: 1rem;
        --text-body--line-height: 1.5;
        --text-heading: 1.25rem;
        --text-heading--line-height: 1.4;
        --text-page-title: 1.5rem;
        --text-page-title--line-height: 1.35;

        --radius-card: 8px;
        --radius-pill: 999px;

        --shadow-menu: 0 8px 24px rgba(23, 23, 23, 0.1);
        --shadow-modal: 0 24px 64px rgba(23, 23, 23, 0.18);
      }
    </style>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-canvas);
        color: var(--color-ink-1);
      }
      ::selection {
        background: var(--color-primary-soft);
      }
      .preview-bar {
        border-bottom: 1px dashed var(--color-line-strong);
        background: var(--color-surface-muted);
      }
      .field-input.is-invalid {
        border-color: var(--color-danger);
      }
      .field-input.is-invalid:focus {
        border-color: var(--color-danger);
        --tw-ring-color: var(--color-danger);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
      @media print {
        .preview-bar {
          display: none !important;
        }
      }
    </style>
  </head>

  <body class="antialiased">
    <!-- 디자인 미리보기 전용 — 제품 UI 아님 -->
    
    <!-- ===== 공통 헤더 ===== -->
    <header class="sticky top-0 z-30 border-b border-line bg-surface">
      <div class="mx-auto flex h-14 max-w-[1200px] items-center gap-4 px-4 sm:h-16 sm:gap-6 sm:px-6">
        <a href="index.html" class="flex flex-none items-center gap-2" aria-label="물품 현황 — 홈">
          <img src="assets/logo.png" alt="" class="h-7 w-7 rounded-card" />
          <span class="hidden text-[15px] font-semibold tracking-[-0.015em] text-ink-1 sm:block">물품 대여</span>
        </a>

        <nav class="flex min-w-0 items-center gap-4 sm:gap-6" aria-label="주 메뉴">
          <a href="index.html" class="flex h-14 items-center border-b-2 border-transparent text-body text-ink-2 transition-colors hover:text-ink-1 sm:h-16">물품 현황</a>
          <a href="my-rentals.html" class="flex h-14 items-center border-b-2 border-transparent text-body text-ink-2 transition-colors hover:text-ink-1 sm:h-16">대여 기록</a>
        </nav>

        <div class="relative ml-auto flex flex-none items-center">
          <button
            type="button"
            class="flex h-10 items-center gap-2 rounded-pill text-body text-ink-2 transition-colors hover:text-ink-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            id="account-btn"
            aria-expanded="false"
            aria-haspopup="menu"
            aria-label="계정 메뉴 — 김하늘"
          >
            <span data-header-initial class="flex h-8 w-8 items-center justify-center rounded-pill bg-primary-soft text-fine font-semibold text-primary-strong" aria-hidden="true">김</span>
            <span data-header-name class="hidden max-w-[140px] truncate md:block">김하늘</span>
            <svg class="hidden h-4 w-4 sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <div
            id="account-menu"
            class="absolute right-0 top-[calc(100%+8px)] z-20 hidden min-w-[176px] overflow-hidden rounded-card border border-line bg-surface shadow-menu"
            role="menu"
          >
            <a href="mypage.html" role="menuitem" class="block px-4 py-2 text-body text-ink-1 transition-colors hover:bg-surface-muted">내 정보</a>
            <a href="login.html" role="menuitem" class="block px-4 py-2 text-body text-danger transition-colors hover:bg-surface-muted">로그아웃</a>
          </div>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-[720px] px-4 pb-10 pt-6 sm:px-6 sm:pt-8">
      <div>
        <h1 class="text-page-title font-bold tracking-[-0.015em] text-ink-1">내 정보</h1>
        <p class="mt-2 text-fine text-ink-2">계정 정보와 연락처를 관리해요.</p>
      </div>

      <!-- 연락처 미등록 상태는 mypage.html?nophone=1 로 확인 -->
      <div
        id="phone-banner"
        class="mt-4 hidden flex-col gap-2 rounded-card border border-line bg-primary-soft px-4 py-3 text-fine text-primary-strong sm:flex-row sm:items-start sm:justify-between sm:gap-4"
      >
        <p>물품을 대여하려면 연락처를 등록해야 해요.</p>
        <button
          id="banner-edit"
          type="button"
          class="flex-none self-start font-semibold underline underline-offset-2 transition-colors hover:text-primary-deep focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          연락처 등록하기
        </button>
      </div>

      <section class="mt-6">
        <h2 class="text-heading font-semibold tracking-[-0.015em] text-ink-1">계정 정보</h2>

        <div id="account-card" data-mode="view" class="mt-4 rounded-card border border-line bg-surface p-6 max-sm:p-4">
          <!-- 표시 모드 -->
          <div data-view>
            <div class="flex items-start justify-between gap-4">
              <div class="flex min-w-0 items-center gap-3">
                <span data-avatar-initial class="flex h-12 w-12 flex-none items-center justify-center rounded-pill bg-primary-soft text-body font-semibold text-primary-strong" aria-hidden="true">김</span>
                <div class="min-w-0">
                  <p data-display-name class="truncate text-body font-semibold text-ink-1">김하늘</p>
                  <p class="mt-1 text-fine text-ink-2">정토회</p>
                </div>
              </div>
              <button
                id="edit-btn"
                type="button"
                class="inline-flex h-9 flex-none items-center rounded-card border border-line bg-surface px-4 text-body font-medium text-ink-1 transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
              >
                수정
              </button>
            </div>

            <dl class="mt-6 divide-y divide-line border-t border-line">
              <div class="flex items-center justify-between gap-4 py-2">
                <dt class="text-fine text-ink-2">이메일</dt>
                <dd class="truncate text-body text-ink-1">haneul@jungto.org</dd>
              </div>
              <div class="flex items-center justify-between gap-4 py-2">
                <dt class="text-fine text-ink-2">연락처</dt>
                <dd data-display-phone class="text-body tabular-nums text-ink-1">010-1234-5678</dd>
              </div>
            </dl>

            <p id="saved-msg" class="mt-3 hidden items-center gap-1 text-fine text-ink-2" role="status">
              <svg class="h-4 w-4 text-primary-strong" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6 9 17l-5-5" />
              </svg>
              저장했어요
            </p>
          </div>

          <!-- 수정 모드 -->
          <form id="edit-form" data-edit class="hidden">
            <div class="flex items-center gap-3">
              <span data-avatar-initial class="flex h-12 w-12 flex-none items-center justify-center rounded-pill bg-primary-soft text-body font-semibold text-primary-strong" aria-hidden="true">김</span>
              <div>
                <p class="text-body font-semibold text-ink-1">계정 정보 수정</p>
                <p class="mt-1 text-fine text-ink-2">이메일은 변경할 수 없어요.</p>
              </div>
            </div>

            <div class="mt-4 flex items-center justify-between gap-4 rounded-card bg-surface-muted px-4 py-2 text-fine">
              <span class="text-ink-2">이메일</span>
              <span class="truncate text-ink-1">haneul@jungto.org</span>
            </div>

            <label class="mt-4 block">
              <span class="text-fine font-medium text-ink-2">이름 <span class="text-danger">*</span></span>
              <input
                id="edit-name"
                autocomplete="name"
                aria-describedby="edit-error"
                class="field-input mt-2 h-10 w-full rounded-card border border-line bg-surface px-4 text-body text-ink-1 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
            </label>

            <label class="mt-4 block">
              <span class="text-fine font-medium text-ink-2">휴대폰 번호 <span class="text-danger">*</span></span>
              <input
                id="edit-phone"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                aria-describedby="edit-error"
                class="field-input mt-2 h-10 w-full rounded-card border border-line bg-surface px-4 text-body text-ink-1 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
            </label>

            <p id="edit-error" class="mt-2 hidden text-fine text-danger" role="alert">
              이름과 연락처를 모두 입력해 주세요.
            </p>

            <div class="mt-4 flex justify-end gap-2">
              <button
                id="cancel-btn"
                type="button"
                class="inline-flex h-9 items-center rounded-card border border-line bg-surface px-4 text-body font-medium text-ink-1 transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
              >
                취소
              </button>
              <button
                type="submit"
                class="inline-flex h-9 items-center rounded-card bg-primary-strong px-4 text-body font-semibold text-white transition-colors hover:bg-primary-deep focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
              >
                저장
              </button>
            </div>
          </form>
        </div>

        <p class="mt-3 text-fine text-ink-2">연락처는 물품 대여·반납 안내에만 사용해요.</p>
      </section>
    </main>

    <script>
      const card = document.getElementById("account-card");
      const view = card.querySelector("[data-view]");
      const editForm = document.getElementById("edit-form");
      const editBtn = document.getElementById("edit-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const nameInput = document.getElementById("edit-name");
      const phoneInput = document.getElementById("edit-phone");
      const error = document.getElementById("edit-error");
      const saved = document.getElementById("saved-msg");
      const displayName = card.querySelector("[data-display-name]");
      const displayPhone = card.querySelector("[data-display-phone]");
      const banner = document.getElementById("phone-banner");

      function setMode(mode) {
        const editing = mode === "edit";
        view.classList.toggle("hidden", editing);
        editForm.classList.toggle("hidden", !editing);
        card.dataset.mode = mode;
        saved.classList.add("hidden");
        saved.classList.remove("flex");

        if (editing) {
          const name = displayName.textContent.trim();
          const phone = displayPhone.textContent.trim();
          nameInput.value = name === "미등록" ? "" : name;
          phoneInput.value = phone === "미등록" ? "" : phone;
          error.classList.add("hidden");
          nameInput.classList.remove("is-invalid");
          phoneInput.classList.remove("is-invalid");
          if (!phoneInput.value.trim()) phoneInput.focus();
          else nameInput.focus();
        }
      }

      editBtn.addEventListener("click", () => setMode("edit"));
      cancelBtn.addEventListener("click", () => setMode("view"));
      document.getElementById("banner-edit").addEventListener("click", () => setMode("edit"));

      [nameInput, phoneInput].forEach((input) => {
        input.addEventListener("input", () => {
          input.classList.remove("is-invalid");
          if (nameInput.value.trim() && phoneInput.value.trim()) {
            error.classList.add("hidden");
          }
        });
      });

      editForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        nameInput.classList.toggle("is-invalid", !name);
        phoneInput.classList.toggle("is-invalid", !phone);

        if (!name || !phone) {
          error.textContent =
            !name && !phone
              ? "이름과 연락처를 모두 입력해 주세요"
              : !name
                ? "이름을 입력해 주세요"
                : "연락처를 입력해 주세요";
          error.classList.remove("hidden");
          return;
        }

        error.classList.add("hidden");
        displayName.textContent = name;
        displayPhone.textContent = phone;

        const initial = name.charAt(0).toUpperCase();
        document.querySelectorAll("[data-header-name]").forEach((el) => (el.textContent = name));
        document
          .querySelectorAll("[data-header-initial], [data-avatar-initial]")
          .forEach((el) => (el.textContent = initial));

        setMode("view");
        saved.classList.remove("hidden");
        saved.classList.add("flex");
        banner.classList.add("hidden");
        banner.classList.remove("flex");
      });

      // ?nophone=1 — 연락처 미등록 상태
      if (new URLSearchParams(location.search).get("nophone") === "1") {
        displayPhone.textContent = "미등록";
        banner.classList.remove("hidden");
        banner.classList.add("flex");
      }

      // ===== 계정 메뉴 =====
      const accountBtn = document.getElementById("account-btn");
      const accountMenu = document.getElementById("account-menu");
      if (accountBtn && accountMenu) {
        const closeAccountMenu = () => {
          accountMenu.classList.add("hidden");
          accountBtn.setAttribute("aria-expanded", "false");
        };
        accountBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          const hidden = accountMenu.classList.toggle("hidden");
          accountBtn.setAttribute("aria-expanded", String(!hidden));
        });
        document.addEventListener("pointerdown", (event) => {
          if (accountMenu.classList.contains("hidden")) return;
          if (event.composedPath().includes(accountBtn) || event.composedPath().includes(accountMenu)) return;
          closeAccountMenu();
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeAccountMenu();
        });
      }
    </script>
    <script src="preview.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <!-- @begin head -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/components.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-canvas: #f6f7f9;
        --color-ink-1: #111827;
        --color-ink-2: #4b5563;
        --color-ink-3: #9ca3af;
        --color-surface: #ffffff;
        --color-surface-muted: #f3f4f6;
        --color-line: #e5e7eb;
        --color-line-strong: #d1d5db;
        --color-primary: #ea580c;
        --color-primary-strong: #c2410c;
        --color-primary-deep: #9a3412;
        --color-primary-soft: #fff1e8;
        --color-warning: #b45309;
        --color-warning-soft: #fffbeb;
        --color-danger: #dc2626;
        --color-danger-soft: #fef2f2;

        --font-sans:
          "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

        --text-fine: 0.875rem;
        --text-fine--line-height: 1.5;
        --text-body: 1rem;
        --text-body--line-height: 1.5;
        --text-heading: 1.25rem;
        --text-heading--line-height: 1.4;
        --text-page-title: 1.5rem;
        --text-page-title--line-height: 1.35;

        --radius-card: 8px;
        --radius-pill: 999px;

        --shadow-menu: 0 8px 24px rgba(23, 23, 23, 0.1);
        --shadow-modal: 0 24px 64px rgba(23, 23, 23, 0.18);
      }
    </style>
    <!-- @end head -->
    <title>로그인 — 물품 대여</title>

    <style>

    </style>
  </head>

  <body class="flex min-h-dvh flex-col antialiased">
    <!-- 디자인 미리보기 전용 — 제품 UI 아님 -->
    
    <main class="flex flex-1 flex-col items-center justify-center px-6 py-8">
      <div class="w-full max-w-[340px]">
        <div class="flex flex-col items-center text-center">
          <img src="assets/logo.png" alt="" class="h-10 w-10 rounded-card sm:h-12 sm:w-12" />
          <h1 class="mt-3 text-page-title font-bold tracking-[-0.015em] text-ink-1">물품 대여</h1>
          <p class="mt-2 max-w-[280px] text-body leading-[1.5] text-ink-2">
            필요한 물건을 빌리고,<br />다 쓰면 돌려주세요.
          </p>
        </div>

        <button
          id="google-login"
          type="button"
          class="mt-8 flex h-10 w-full items-center justify-center gap-2 rounded-card border border-line-strong bg-surface px-4 text-body font-medium text-ink-1 transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          <svg class="h-[18px] w-[18px] flex-none" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.58v2.98h3.88c2.27-2.09 3.54-5.17 3.54-8.8Z" />
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.93l-3.88-2.98c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09A12 12 0 0 0 12 24Z" />
            <path fill="#FBBC05" d="M5.27 14.29A7.2 7.2 0 0 1 4.89 12c0-.8.14-1.57.38-2.29V6.62H1.29A12 12 0 0 0 0 12c0 1.94.46 3.77 1.29 5.38l3.98-3.09Z" />
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75Z" />
          </svg>
          Google로 계속하기
        </button>

        <p id="login-error" class="mt-3 hidden text-center text-fine text-danger" role="alert"></p>

        <p id="login-note" class="mt-4 text-center text-fine leading-[1.5] text-ink-2">
          정토회 계정(@jungto.org)으로 로그인하면<br />바로 회원이 돼요.
        </p>
      </div>

      <footer class="mt-10 flex items-center gap-4 text-fine text-ink-2">
        <a href="policy.html?kind=terms" class="transition-colors hover:text-ink-1 hover:underline">이용약관</a>
        <span class="text-line-strong" aria-hidden="true">·</span>
        <a href="policy.html?kind=privacy" class="transition-colors hover:text-ink-1 hover:underline">개인정보처리방침</a>
      </footer>
    </main>

    <script>
      // ?error=denied|deactivated|unavailable 로 로그인 오류 문구를 확인한다.
      const messages = {
        denied: "정토회 계정(@jungto.org)으로 로그인해주세요.",
        deactivated: "탈퇴 처리된 계정이에요. 관리자에게 문의해주세요.",
        unavailable: "로그인 상태를 확인할 수 없어요. 연결 상태를 확인하고 다시 시도해주세요.",
      };
      const error = new URLSearchParams(location.search).get("error");
      const errorEl = document.getElementById("login-error");
      if (error && messages[error]) {
        errorEl.textContent = messages[error];
        errorEl.classList.remove("hidden");
        document.getElementById("login-note").classList.add("hidden");
      }

      // 실제 앱은 구글 동의 화면으로 이동한다. 시안에서는 신규 회원 흐름을 이어서 보여준다.
      document.getElementById("google-login").addEventListener("click", () => {
        location.href = "signup-profile.html";
      });
    </script>
    <script src="preview.js"></script>
  </body>
</html>

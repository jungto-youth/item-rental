<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>계정 정보 — 물품 대여</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-canvas: #f6f7f9;
        --color-ink-1: #111827;
        --color-ink-2: #4b5563;
        --color-ink-3: #9ca3af;
        --color-surface: #ffffff;
        --color-surface-muted: #f3f4f6;
        --color-line: #e5e7eb;
        --color-line-strong: #d1d5db;
        --color-primary: #ea580c;
        --color-primary-strong: #c2410c;
        --color-primary-deep: #9a3412;
        --color-primary-soft: #fff1e8;
        --color-warning: #b45309;
        --color-warning-soft: #fffbeb;
        --color-danger: #dc2626;
        --color-danger-soft: #fef2f2;

        --font-sans:
          "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

        --text-fine: 0.875rem;
        --text-fine--line-height: 1.5;
        --text-body: 1rem;
        --text-body--line-height: 1.5;
        --text-heading: 1.25rem;
        --text-heading--line-height: 1.4;
        --text-page-title: 1.5rem;
        --text-page-title--line-height: 1.35;

        --radius-card: 8px;
        --radius-pill: 999px;

        --shadow-menu: 0 8px 24px rgba(23, 23, 23, 0.1);
        --shadow-modal: 0 24px 64px rgba(23, 23, 23, 0.18);
      }
    </style>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-canvas);
        color: var(--color-ink-1);
      }
      ::selection {
        background: var(--color-primary-soft);
      }
      .field-input.is-invalid {
        border-color: var(--color-danger);
      }
      .field-input.is-invalid:focus {
        border-color: var(--color-danger);
        --tw-ring-color: var(--color-danger);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body class="flex min-h-dvh flex-col antialiased">
    <!-- 디자인 미리보기 전용 — 제품 UI 아님 -->

    <!-- 로그인에 이어지는 온보딩 2단계 — 셸 헤더·푸터 없이 한 화면에 집중한다 -->
    <main class="flex flex-1 flex-col items-center px-6 py-8">
      <div class="my-auto w-full max-w-[340px]">
        <div class="text-center">
          <h1 class="text-page-title font-bold tracking-[-0.015em] text-ink-1">반가워요</h1>
          <p class="mt-2 text-body leading-[1.5] text-ink-2">물품을 빌리려면 이름과 연락처가 필요해요.</p>
        </div>

        <form id="profile-form" class="mt-6 rounded-card border border-line bg-surface p-6 max-sm:p-4">
          <div class="mb-4 flex items-center gap-2 rounded-card bg-surface-muted px-4 py-2 text-fine">
            <svg class="h-4 w-4 flex-none text-primary-strong" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span class="text-ink-2">로그인한 계정</span>
            <span class="ml-auto truncate text-ink-1">haneul@jungto.org</span>
          </div>

          <label class="block">
            <span class="text-fine font-medium text-ink-2">이름 <span class="text-danger">*</span></span>
            <input
              id="name"
              name="name"
              autocomplete="name"
              value="김하늘"
              aria-required="true"
              aria-describedby="form-error"
              class="field-input mt-2 h-10 w-full rounded-card border border-line bg-surface px-4 text-body text-ink-1 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
            />
          </label>

          <label class="mt-4 block">
            <span class="text-fine font-medium text-ink-2">휴대폰 번호 <span class="text-danger">*</span></span>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="010-1234-5678"
              aria-required="true"
              aria-describedby="form-error"
              class="field-input mt-2 h-10 w-full rounded-card border border-line bg-surface px-4 text-body text-ink-1 placeholder:text-ink-2 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
            />
          </label>

          <p id="form-error" class="mt-2 hidden text-fine text-danger" role="alert">이름과 연락처를 모두 입력해 주세요.</p>

          <button
            type="submit"
            class="mt-6 flex h-10 w-full items-center justify-center rounded-card bg-primary-strong text-body font-semibold text-white transition-colors hover:bg-primary-deep focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          >
            저장
          </button>
          <p class="mt-2 text-center text-fine text-ink-2">저장하면 바로 물품을 둘러볼 수 있어요.</p>
        </form>

        <p class="mt-4 text-center text-fine text-ink-2">입력한 정보는 물품 대여 연락에만 사용해요.</p>

        <div class="mt-6 text-center">
          <a href="login.html" class="text-fine text-ink-2 transition-colors hover:text-ink-1 hover:underline">다른 계정으로 로그인</a>
        </div>

        <footer class="mt-4 flex items-center justify-center gap-4 text-fine text-ink-2">
          <a href="policy.html?kind=terms" class="transition-colors hover:text-ink-1 hover:underline">이용약관</a>
          <span class="text-line-strong" aria-hidden="true">·</span>
          <a href="policy.html?kind=privacy" class="transition-colors hover:text-ink-1 hover:underline">개인정보처리방침</a>
        </footer>
      </div>
    </main>

    <script>
      const form = document.getElementById("profile-form");
      const nameInput = document.getElementById("name");
      const phoneInput = document.getElementById("phone");
      const error = document.getElementById("form-error");

      function clearInvalidOnInput(input) {
        input.addEventListener("input", () => {
          input.classList.remove("is-invalid");
          if (nameInput.value.trim() && phoneInput.value.trim()) {
            error.classList.add("hidden");
          }
        });
      }

      clearInvalidOnInput(nameInput);
      clearInvalidOnInput(phoneInput);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        nameInput.classList.toggle("is-invalid", !name);
        phoneInput.classList.toggle("is-invalid", !phone);

        if (!name || !phone) {
          error.textContent =
            !name && !phone
              ? "이름과 연락처를 모두 입력해 주세요"
              : !name
                ? "이름을 입력해 주세요"
                : "연락처를 입력해 주세요";
          error.classList.remove("hidden");
          return;
        }

        location.href = "mypage.html";
      });
    </script>
    <script src="preview.js"></script>
  </body>
</html>

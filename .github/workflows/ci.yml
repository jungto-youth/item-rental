name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json 기준 설치 — check가 node_modules의 tsc/vite를 쓰므로 필요
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (web + server + tests + scripts)
        run: npm run check

      - name: Unit tests (DB 불필요 — Sql 스텁)
        run: npm test
